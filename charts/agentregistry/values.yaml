# @section Global parameters

global:
  # -- Global container image registry override
  imageRegistry: ""
  # -- Global Docker registry secret names
  imagePullSecrets: []

# @section Common parameters

# -- Override the name of the chart
nameOverride: ""
# -- Override the full name of the chart
fullnameOverride: ""
# -- Labels to add to all deployed resources
commonLabels: {}
# -- Annotations to add to all deployed resources
commonAnnotations: {}

# @section Agent Registry image parameters

image:
  # -- Agent Registry image registry
  registry: ghcr.io
  # -- Agent Registry image repository (org/path, excluding the image name)
  repository: agentregistry-dev/agentregistry
  # -- Agent Registry image name
  name: server
  # -- Agent Registry image tag (immutable tags recommended). Leave empty to use .Chart.AppVersion.
  tag: ""
  # -- Agent Registry image digest (overrides tag if set)
  digest: ""
  # -- Agent Registry image pull policy
  pullPolicy: IfNotPresent
  # -- Agent Registry image pull secrets
  pullSecrets: []

# @section Agent Registry configuration

# -- Number of Agent Registry replicas
replicaCount: 1

config:
  # -- Listen address for the HTTP server
  serverAddress: ":8080"
  # -- Agent Registry MCP server port
  agentRegistryMcpPort: "31313"
  # -- Enable input validation on the registry API
  enableRegistryValidation: "false"

# @section HTTP hardening

# -- HTTP server protections. Security headers (nosniff, no framing, no
# referrer) are always sent.
http:
  # -- Browser origins (scheme://host[:port]) allowed to call the API from
  # another site, or ["*"]. Empty: any origin with auth disabled, same-origin
  # only with auth required.
  corsAllowedOrigins: []
  # -- Time to read a whole request.
  readTimeout: 30s
  # -- Time to write a response (not applied to the MCP server, which streams).
  writeTimeout: 2m
  # -- How long an idle keep-alive connection stays open.
  idleTimeout: 2m
  # -- Largest request body accepted, in bytes; 0 for no limit.
  maxBodyBytes: 1048576
  # -- Strict-Transport-Security max-age; set it (for example 8760h) when the
  # registry is reached over HTTPS. 0s sends no header.
  hstsMaxAge: 0s
  # -- Replaces the web UI's Content-Security-Policy. Empty: the registry's
  # own origin plus the sign-in service's (auth.ui.issuer).
  contentSecurityPolicy: ""

# @section Leader election

# -- Elects the one replica that runs the background controllers (Deployment
# reconciliation and discovery, Plugin and Skill pinning). Every replica
# serves the API. Needed to run more than one replica.
leaderElection:
  # -- "postgres" (an advisory lock in the registry's database, the
  # default), "kubernetes" (a Lease; the chart grants RBAC on leases), or
  # "none" (every replica runs the controllers; replicaCount must be 1).
  # Change it with all old pods stopped: replicas using different
  # mechanisms do not see each other.
  mechanism: postgres
  # -- Name of the lock or Lease the replicas compete for.
  name: agentregistry-controllers
  # -- Others take over a silent leader after this long.
  leaseDuration: 15s
  # -- The leader stops if it cannot renew (or reach Postgres) within this.
  renewDeadline: 10s
  # -- How often replicas campaign and the leader renews.
  retryPeriod: 2s

# @section Approvals

# -- Approval workflows for publish and deploy (OpenID AuthZEN Access Request
# and Approval Profile). A batch-apply change the PDP refuses but marks
# requestable is held, submitted to the PDP's access request service, and
# applied by the registry once approved. Which changes need approval and who
# approves them is the PDP policy's decision. Needs auth.mode=required. See
# docs/approvals.md.
approvals:
  enabled: false
  # -- The registry's OAuth client (client credentials), accepted by the
  # access request service's caller_auth.
  tokenUrl: ""
  clientId: ""
  # -- Existing Secret holding the client secret.
  clientSecretRef:
    name: ""
    key: client-secret
  scopes: []
  # -- How often held requests are checked.
  pollInterval: 15s
  # -- Optional: the https URL of this registry's POST /approvals/callback,
  # which the service calls when a request ends, and an existing Secret with
  # the shared HMAC secret (at least 32 bytes).
  callback:
    url: ""
    secretRef:
      name: ""
      key: secret

# @section Audit log

# -- Audit log: every apply and delete, and every read the authorization
# service refused, stored in Postgres and served to registry admins at
# GET /v0/audit and on the UI's Audit log page.
audit:
  # -- Record audit events.
  enabled: true
  # -- How long events are kept; 0s keeps them forever.
  retention: 2160h
  # -- Also export each event as an OpenTelemetry log record over OTLP/HTTP.
  otlp:
    enabled: false
    # -- Collector base URL, for example http://otel-collector:4318. Sets
    # OTEL_EXPORTER_OTLP_ENDPOINT; add headers or TLS settings through
    # extraEnvVars (OTEL_EXPORTER_OTLP_HEADERS, ...).
    endpoint: ""

# @section Authentication and authorization

# -- Authentication (JWT) and authorization (an OpenID AuthZEN 1.0 PDP). Settings
# are rendered into the ConfigMap; credentials come only from existing Secrets.
# See docs/auth/authzen-contract.md.
auth:
  # -- "disabled" (no authentication) or "required". With "required" the server
  # refuses to start unless issuers and authzen.url are set.
  mode: disabled
  # -- Trusted token issuers. Each entry: issuer, audiences, and optionally
  # jwksUri, algorithms, rolesClaim, groupsClaim, usernameClaim, clientIdClaim,
  # clientSubjectClaim.
  issuers: []
  # -- Leeway for token exp, nbf and iat.
  clockSkew: 30s
  # -- How often the issuers' signing keys are fetched again: how long a key
  # removed from the IdP (for example after a leak) is still trusted.
  jwksRefresh: 5m
  # -- Exact paths served without a token (each also under /v0).
  openPaths:
    - /health
    - /ping
    - /version
  # -- Web UI sign-in (authorization code + PKCE). Set both issuer and clientId, or neither.
  ui:
    issuer: ""
    clientId: ""
    scopes: openid profile email
  # -- Publish RFC 9728 protected-resource metadata for the MCP endpoint.
  mcp:
    # -- Public URL of the MCP endpoint. Empty publishes no metadata.
    resource: ""
    scopes: []
  authzen:
    # -- PDP base URL; endpoints are discovered from <url>/.well-known/authzen-configuration.
    url: ""
    # -- Bound on every PDP call; a timeout is a denial.
    timeout: 1500ms
    # -- How long permit decisions are cached. 0 disables caching.
    cacheTTL: 5s
    # -- Maximum rows a list request authorizes.
    listMax: 1000
    # -- OAuth 2.0 client credentials for calling the PDP: token endpoint, client
    # ID, scopes, and the Secret holding the client secret.
    tokenUrl: ""
    clientId: ""
    scopes: []
    clientSecretRef:
      name: ""
      key: client-secret
    # -- Or a static bearer token for PDPs without OAuth, from a Secret.
    staticTokenRef:
      name: ""
      key: token

# @section Secret store

# -- Backend used to persist Secret resource payloads.
secretStore:
  # -- "Kubernetes" stores core/v1.Secrets; "Database" encrypts payloads in
  # Postgres; "OpenBao" keeps them in an OpenBao KV v2 engine (see
  # docs/secrets-openbao.md).
  type: Kubernetes
  # -- Copy payloads missing from the store above from this earlier store
  # ("Kubernetes" or "Database") at startup. Originals are left in place.
  migrateFrom: ""
  # -- OpenBao settings, used when type is OpenBao.
  openbao:
    # -- OpenBao's URL, for example https://openbao.openbao.svc:8200.
    address: ""
    # -- OpenBao namespace; empty for the root.
    namespace: ""
    # -- Path of the KV v2 engine.
    mount: agentregistry
    # -- Payloads live under <mount>/data/<pathPrefix>/<namespace>/<name>.
    pathPrefix: secrets
    # -- "kubernetes" (the pod's service account), "approle" or "token".
    auth: kubernetes
    # -- Path of the auth method; empty for its default.
    authMount: ""
    # -- Role of the kubernetes auth method, bound to this release's service account.
    role: agentregistry
    # -- Existing Secret with the AppRole role ID and secret ID (auth approle).
    appRoleSecretRef:
      name: ""
      roleIdKey: role-id
      secretIdKey: secret-id
    # -- Existing Secret with a token (auth token, for development).
    tokenSecretRef:
      name: ""
      key: token
    # -- Existing Secret with the CA certificate that signed OpenBao's TLS certificate.
    caSecretRef:
      name: ""
      key: ca.crt
    # -- Timeout of each call to OpenBao.
    timeout: 10s
  # -- Existing Secret containing the hex-encoded 32-byte AES-256 key for Database.
  encryptionKeySecretRef:
    # -- Name of the Secret in the install namespace.
    name: ""
    # -- Key containing the encryption key.
    key: SECRET_STORE_ENCRYPTION_KEY

# @section Deployment parameters

# -- Override default container command (evaluated as a template)
command: []
# -- Override default container args (evaluated as a template)
args: []

# -- Number of old ReplicaSets to retain
revisionHistoryLimit: 10
# -- Mount the service account token in the pod
automountServiceAccountToken: true
# -- Add custom entries to /etc/hosts
hostAliases: []
# -- Extra labels for Agent Registry pods
podLabels: {}
# -- Extra annotations for Agent Registry pods
podAnnotations: {}
# -- Lifecycle hooks for the Agent Registry container
lifecycleHooks: {}
# -- Seconds the pod needs to terminate gracefully
terminationGracePeriodSeconds: ""
# -- Priority class name for the Agent Registry pods
priorityClassName: ""
# -- Name of the scheduler to use
schedulerName: ""
# -- DNS policy for the pod
dnsPolicy: ""
# -- DNS configuration for the pod
dnsConfig: {}
# -- Topology spread constraints for pod assignment
topologySpreadConstraints: []

# @section Security context

podSecurityContext:
  # -- Enable pod-level security context
  enabled: true
  # -- Group ID for the pod filesystem
  fsGroup: 1001
  # -- Policy for changing fsGroup ownership
  fsGroupChangePolicy: Always

containerSecurityContext:
  # -- Enable container-level security context
  enabled: true
  # -- User ID to run the container as
  runAsUser: 1001
  # -- Group ID to run the container as
  runAsGroup: 1001
  # -- Prevent running as root
  runAsNonRoot: true
  # -- Mount root filesystem as read-only
  readOnlyRootFilesystem: true
  # -- Allow privilege escalation
  allowPrivilegeEscalation: false
  capabilities:
    # -- Linux capabilities to drop
    drop:
      - ALL
  seccompProfile:
    # -- Seccomp profile type
    type: RuntimeDefault

# @section Resource management

# -- Resource requests and limits for the Agent Registry container
resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi

# @section Liveness probe

livenessProbe:
  # -- Enable liveness probe
  enabled: true
  # -- Initial delay before liveness check
  initialDelaySeconds: 30
  # -- Period between liveness checks
  periodSeconds: 10
  # -- Timeout for the liveness check
  timeoutSeconds: 5
  # -- Failure threshold for liveness check
  failureThreshold: 6
  # -- Success threshold for liveness check
  successThreshold: 1

# @section Readiness probe

readinessProbe:
  # -- Enable readiness probe
  enabled: true
  # -- Initial delay before readiness check
  initialDelaySeconds: 10
  # -- Period between readiness checks
  periodSeconds: 5
  # -- Timeout for the readiness check
  timeoutSeconds: 3
  # -- Failure threshold for readiness check
  failureThreshold: 3
  # -- Success threshold for readiness check
  successThreshold: 1

# @section Startup probe

startupProbe:
  # -- Enable startup probe
  enabled: true
  # -- Initial delay before startup check
  initialDelaySeconds: 5
  # -- Period between startup checks
  periodSeconds: 5
  # -- Timeout for the startup check
  timeoutSeconds: 3
  # -- Failure threshold for startup check (controls max startup time)
  failureThreshold: 30
  # -- Success threshold for startup check
  successThreshold: 1

# @section Extensibility

# -- Array of extra environment variables for the Agent Registry container.
# Additive only — cannot override env vars the chart already renders.
# For credentialed fields use the dedicated knobs (e.g.
# `database.postgres.external.secretRef`).
extraEnvVars: []

# @section Scheduling

# -- Node labels for pod assignment
nodeSelector: {}
# -- Tolerations for pod assignment
tolerations: []
# -- Affinity rules for pod assignment (overrides preset if set)
affinity: {}
# -- Pod affinity preset (soft or hard)
podAffinityPreset: ""
# -- Pod anti-affinity preset (soft or hard)
podAntiAffinityPreset: soft

nodeAffinityPreset:
  # -- Node affinity preset type (soft or hard)
  type: ""
  # -- Node label key for affinity
  key: ""
  # -- Node label values for affinity
  values: []

# @section Service configuration

service:
  # -- Kubernetes Service type
  type: ClusterIP
  ports:
    # -- HTTP port
    http: 12121
    # -- MCP HTTP port
    mcp: 31313
  targetPorts:
    # -- HTTP container target port
    http: 8080
    # -- MCP container target port
    mcp: 31313
  nodePorts:
    # -- NodePort for HTTP (when type is NodePort)
    http: ""
    # -- NodePort for MCP (when type is NodePort)
    mcp: ""
  # -- Specific cluster IP (set to None for headless)
  clusterIP: ""
  # -- LoadBalancer IP
  loadBalancerIP: ""
  # -- LoadBalancer allowed source ranges
  loadBalancerSourceRanges: []
  # -- External traffic policy
  externalTrafficPolicy: Cluster
  # -- Service annotations
  annotations: {}
  # -- Session affinity (None or ClientIP)
  sessionAffinity: None
  # -- Session affinity configuration
  sessionAffinityConfig: {}

# @section Service account

serviceAccount:
  # -- Create a dedicated ServiceAccount
  create: true
  # -- Override the auto-generated ServiceAccount name
  name: ""
  # -- ServiceAccount annotations
  annotations: {}
  # -- Mount API token in the ServiceAccount
  automountServiceAccountToken: true

# @section RBAC

rbac:
  # -- Enable RBAC resource creation
  enabled: true
  # -- Namespaces Agent Registry is permitted to manage resources in.
  # Empty list grants cluster-wide access via ClusterRole (default).
  # Set to one or more namespaces to create a Role in each and restrict access accordingly.
  # Note: read access to the cluster scoped APIs is always granted via ClusterRole regardless of this setting.
  watchedNamespaces: []

# @section Database

database:
  postgres:
    # -- Backend type: "bundled" (deploy the chart's in-cluster dev/eval Postgres pod) or
    # "external" (connect to a Postgres you bring yourself; configure under `external` below).
    type: bundled
    # -- External (BYO) PostgreSQL configuration. Only consumed when `type: external`.
    external:
      # -- Inline connection string. Mutually exclusive with `external.secretRef.name`.
      url: ""
      # -- Source the connection string from an existing Secret instead of inlining it.
      # Use this when credentials are managed by an external secret store (e.g. AWS Secrets Manager
      # via External Secrets Operator) and synced into the cluster as a Secret. The chart does not
      # create or manage this Secret. Mutually exclusive with `external.url`.
      # On credential rotation, Kubernetes does NOT auto-restart the pod — pair with a controller
      # such as stakater/Reloader if you need automatic restarts on Secret content changes.
      secretRef:
        # -- Name of an existing Secret in the release namespace. Leave empty to disable.
        name: ""
        # -- Key within the Secret that holds the connection string.
        key: AGENT_REGISTRY_DATABASE_URL
    # -- Bundled PostgreSQL — dev/eval only. Only consumed when `type: bundled`.
    bundled:
      image:
        # -- Bundled PostgreSQL image registry
        registry: docker.io
        # -- Bundled PostgreSQL image repository (org/namespace)
        repository: library
        # -- Bundled PostgreSQL image name
        name: postgres
        # -- Bundled PostgreSQL image tag
        tag: "18"
        # -- Bundled PostgreSQL image pull policy
        pullPolicy: IfNotPresent
      # -- DB name, user, and password are hardcoded ("agentregistry") for the bundled instance.
      # -- StorageClass for the bundled PostgreSQL PersistentVolumeClaim. Leave empty ("") to use the cluster default StorageClass.
      storageClass: ""
      # -- PersistentVolumeClaim size for the bundled PostgreSQL data directory
      storage: 5Gi
      # -- Resource requests/limits for the bundled PostgreSQL container
      resources:
        requests:
          cpu: 250m
          memory: 256Mi
        limits:
          cpu: "1"
          memory: 1Gi
