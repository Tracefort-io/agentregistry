apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agentregistry.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agentregistry.labels" . | nindent 4 }}
  {{- $annotations := include "agentregistry.annotations" (dict "annotations" dict "context" $) }}
  {{- if $annotations }}
  annotations:
    {{- $annotations | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.replicaCount }}
  {{- if .Values.revisionHistoryLimit }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  {{- end }}
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      {{- include "agentregistry.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/postgresql-secret: {{ include (print $.Template.BasePath "/postgresql-secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if .Values.commonAnnotations }}
        {{- toYaml .Values.commonAnnotations | nindent 8 }}
        {{- end }}
      labels:
        {{- include "agentregistry.selectorLabels" . | nindent 8 }}
        {{- if .Values.podLabels }}
        {{- toYaml .Values.podLabels | nindent 8 }}
        {{- end }}
        {{- if .Values.commonLabels }}
        {{- toYaml .Values.commonLabels | nindent 8 }}
        {{- end }}
    spec:
      {{- include "agentregistry.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ include "agentregistry.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.automountServiceAccountToken }}
      {{- $podSec := include "agentregistry.podSecurityContext" .Values.podSecurityContext }}
      {{- if $podSec }}
      securityContext:
        {{- $podSec | nindent 8 }}
      {{- end }}
      {{- if .Values.hostAliases }}
      hostAliases:
        {{- toYaml .Values.hostAliases | nindent 8 }}
      {{- end }}
      {{- if .Values.dnsPolicy }}
      dnsPolicy: {{ .Values.dnsPolicy }}
      {{- end }}
      {{- if .Values.dnsConfig }}
      dnsConfig:
        {{- toYaml .Values.dnsConfig | nindent 8 }}
      {{- end }}
      {{- if .Values.priorityClassName }}
      priorityClassName: {{ .Values.priorityClassName | quote }}
      {{- end }}
      {{- if .Values.schedulerName }}
      schedulerName: {{ .Values.schedulerName | quote }}
      {{- end }}
      {{- if .Values.terminationGracePeriodSeconds }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- end }}
      {{- $affinity := include "agentregistry.affinity" . }}
      {{- if $affinity }}
      affinity:
        {{- $affinity | nindent 8 }}
      {{- end }}
      {{- if .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      {{- end }}
      {{- if .Values.tolerations }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      {{- end }}
      {{- if .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml .Values.topologySpreadConstraints | nindent 8 }}
      {{- end }}
      {{- if eq .Values.database.postgres.type "bundled" }}
      initContainers:
        - name: wait-for-postgres
          image: {{ include "agentregistry.postgresql.image" . }}
          imagePullPolicy: {{ .Values.database.postgres.bundled.image.pullPolicy }}
          command:
            - sh
            - -c
            - |
              until pg_isready -h {{ include "agentregistry.postgresql.fullname" . }} -p 5432 -U agentregistry; do
                echo "waiting for postgres..."; sleep 2
              done
      {{- end }}
      containers:
        - name: agentregistry
          image: {{ include "agentregistry.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if .Values.command }}
          command:
            {{- tpl (toYaml .Values.command) . | nindent 12 }}
          {{- end }}
          {{- if .Values.args }}
          args:
            {{- tpl (toYaml .Values.args) . | nindent 12 }}
          {{- end }}
          {{- $containerSec := include "agentregistry.containerSecurityContext" .Values.containerSecurityContext }}
          {{- if $containerSec }}
          securityContext:
            {{- $containerSec | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPorts.http }}
              protocol: TCP
            - name: mcp
              containerPort: {{ .Values.service.targetPorts.mcp }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "agentregistry.fullname" . }}-config
          env:
            {{- if eq .Values.database.postgres.type "external" }}
            {{- if .Values.database.postgres.external.secretRef.name }}
            - name: AGENT_REGISTRY_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.postgres.external.secretRef.name }}
                  key: {{ .Values.database.postgres.external.secretRef.key | default "AGENT_REGISTRY_DATABASE_URL" }}
            {{- else }}
            - name: AGENT_REGISTRY_DATABASE_URL
              value: {{ .Values.database.postgres.external.url | quote }}
            {{- end }}
            {{- else }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "agentregistry.fullname" . }}-postgresql
                  key: POSTGRES_PASSWORD
            - name: AGENT_REGISTRY_DATABASE_URL
              value: {{ printf "postgres://agentregistry:$(POSTGRES_PASSWORD)@%s:5432/agentregistry?sslmode=disable" (include "agentregistry.postgresql.fullname" .) | quote }}
            {{- end }}
            # The Lease names its holder by pod and lives in the pod's namespace.
            - name: AGENT_REGISTRY_LEADER_ELECTION_IDENTITY
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: AGENT_REGISTRY_LEADER_ELECTION_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: AGENT_REGISTRY_SECRET_STORE
              value: {{ .Values.secretStore.type | quote }}
            {{- with .Values.secretStore.migrateFrom }}
            - name: AGENT_REGISTRY_SECRET_STORE_MIGRATE_FROM
              value: {{ . | quote }}
            {{- end }}
            {{- if eq .Values.secretStore.type "OpenBao" }}
            {{- with .Values.secretStore.openbao }}
            - name: AGENT_REGISTRY_OPENBAO_ADDR
              value: {{ .address | quote }}
            - name: AGENT_REGISTRY_OPENBAO_NAMESPACE
              value: {{ .namespace | quote }}
            - name: AGENT_REGISTRY_OPENBAO_MOUNT
              value: {{ .mount | quote }}
            - name: AGENT_REGISTRY_OPENBAO_PATH_PREFIX
              value: {{ .pathPrefix | quote }}
            - name: AGENT_REGISTRY_OPENBAO_AUTH
              value: {{ .auth | quote }}
            - name: AGENT_REGISTRY_OPENBAO_AUTH_MOUNT
              value: {{ .authMount | quote }}
            - name: AGENT_REGISTRY_OPENBAO_ROLE
              value: {{ .role | quote }}
            - name: AGENT_REGISTRY_OPENBAO_TIMEOUT
              value: {{ .timeout | quote }}
            {{- if eq .auth "approle" }}
            - name: AGENT_REGISTRY_OPENBAO_APPROLE_ROLE_ID_FILE
              value: /var/run/agentregistry/openbao/approle/role-id
            - name: AGENT_REGISTRY_OPENBAO_APPROLE_SECRET_ID_FILE
              value: /var/run/agentregistry/openbao/approle/secret-id
            {{- end }}
            {{- if eq .auth "token" }}
            - name: AGENT_REGISTRY_OPENBAO_TOKEN_FILE
              value: /var/run/agentregistry/openbao/token/token
            {{- end }}
            {{- if .caSecretRef.name }}
            - name: AGENT_REGISTRY_OPENBAO_CA_CERT_FILE
              value: /var/run/agentregistry/openbao/ca/ca.crt
            {{- end }}
            {{- end }}
            {{- end }}
            - name: AGENT_REGISTRY_SECRET_STORE_KUBERNETES_NAMESPACE
              value: {{ .Release.Namespace | quote }}
            {{- if and (eq .Values.secretStore.type "Database") .Values.secretStore.encryptionKeySecretRef.name }}
            - name: AGENT_REGISTRY_SECRET_STORE_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretStore.encryptionKeySecretRef.name }}
                  key: {{ .Values.secretStore.encryptionKeySecretRef.key }}
            {{- end }}
            {{- if eq .Values.auth.mode "required" }}
            {{- with .Values.auth.authzen.clientSecretRef }}
            {{- if .name }}
            - name: AGENT_REGISTRY_AUTHZEN_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .name }}
                  key: {{ .key }}
            {{- end }}
            {{- end }}
            {{- with .Values.auth.authzen.staticTokenRef }}
            {{- if .name }}
            - name: AGENT_REGISTRY_AUTHZEN_STATIC_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .name }}
                  key: {{ .key }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- if .Values.extraEnvVars }}
            {{- tpl (toYaml .Values.extraEnvVars) . | nindent 12 }}
            {{- end }}
          {{- if .Values.livenessProbe.enabled }}
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
            successThreshold: {{ .Values.livenessProbe.successThreshold }}
          {{- end }}
          {{- if .Values.readinessProbe.enabled }}
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.readinessProbe.failureThreshold }}
            successThreshold: {{ .Values.readinessProbe.successThreshold }}
          {{- end }}
          {{- if .Values.startupProbe.enabled }}
          startupProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: {{ .Values.startupProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.startupProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.startupProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.startupProbe.failureThreshold }}
            successThreshold: {{ .Values.startupProbe.successThreshold }}
          {{- end }}
          {{- if .Values.lifecycleHooks }}
          lifecycle:
            {{- toYaml .Values.lifecycleHooks | nindent 12 }}
          {{- end }}
          {{- if .Values.resources }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- end }}
          volumeMounts:
            {{- if eq .Values.secretStore.type "OpenBao" }}
            {{- with .Values.secretStore.openbao }}
            {{- if eq .auth "approle" }}
            - name: openbao-approle
              mountPath: /var/run/agentregistry/openbao/approle
              readOnly: true
            {{- end }}
            {{- if eq .auth "token" }}
            - name: openbao-token
              mountPath: /var/run/agentregistry/openbao/token
              readOnly: true
            {{- end }}
            {{- if .caSecretRef.name }}
            - name: openbao-ca
              mountPath: /var/run/agentregistry/openbao/ca
              readOnly: true
            {{- end }}
            {{- end }}
            {{- end }}
            {{- if .Values.containerSecurityContext.enabled }}
            {{- if .Values.containerSecurityContext.readOnlyRootFilesystem }}
            - name: tmp
              mountPath: /tmp
            {{- end }}
            {{- end }}
      volumes:
        {{- if eq .Values.secretStore.type "OpenBao" }}
        {{- with .Values.secretStore.openbao }}
        {{- if eq .auth "approle" }}
        - name: openbao-approle
          secret:
            secretName: {{ .appRoleSecretRef.name }}
            items:
              - key: {{ .appRoleSecretRef.roleIdKey }}
                path: role-id
              - key: {{ .appRoleSecretRef.secretIdKey }}
                path: secret-id
        {{- end }}
        {{- if eq .auth "token" }}
        - name: openbao-token
          secret:
            secretName: {{ .tokenSecretRef.name }}
            items:
              - key: {{ .tokenSecretRef.key }}
                path: token
        {{- end }}
        {{- if .caSecretRef.name }}
        - name: openbao-ca
          secret:
            secretName: {{ .caSecretRef.name }}
            items:
              - key: {{ .caSecretRef.key }}
                path: ca.crt
        {{- end }}
        {{- end }}
        {{- end }}
        {{- if .Values.containerSecurityContext.enabled }}
        {{- if .Values.containerSecurityContext.readOnlyRootFilesystem }}
        - name: tmp
          emptyDir: {}
        {{- end }}
        {{- end }}
