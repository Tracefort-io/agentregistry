apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "agentregistry.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agentregistry.labels" . | nindent 4 }}
  {{- $annotations := include "agentregistry.annotations" (dict "annotations" dict "context" $) }}
  {{- if $annotations }}
  annotations:
    {{- $annotations | nindent 4 }}
  {{- end }}
data:
  AGENT_REGISTRY_SERVER_ADDRESS: {{ .Values.config.serverAddress | quote }}
  AGENT_REGISTRY_MCP_PORT: {{ .Values.config.agentRegistryMcpPort | quote }}
  AGENT_REGISTRY_ENABLE_REGISTRY_VALIDATION: {{ .Values.config.enableRegistryValidation | quote }}
  {{- with .Values.http }}
  {{- with .corsAllowedOrigins }}
  AGENT_REGISTRY_CORS_ALLOWED_ORIGINS: {{ join "," . | quote }}
  {{- end }}
  AGENT_REGISTRY_HTTP_READ_TIMEOUT: {{ .readTimeout | quote }}
  AGENT_REGISTRY_HTTP_WRITE_TIMEOUT: {{ .writeTimeout | quote }}
  AGENT_REGISTRY_HTTP_IDLE_TIMEOUT: {{ .idleTimeout | quote }}
  AGENT_REGISTRY_HTTP_MAX_BODY_BYTES: {{ .maxBodyBytes | int64 | quote }}
  AGENT_REGISTRY_HTTP_HSTS_MAX_AGE: {{ .hstsMaxAge | quote }}
  {{- with .contentSecurityPolicy }}
  AGENT_REGISTRY_HTTP_CSP: {{ . | quote }}
  {{- end }}
  {{- end }}
  {{- with .Values.auth }}
  AGENT_REGISTRY_AUTH_MODE: {{ .mode | quote }}
  {{- if eq .mode "required" }}
  AGENT_REGISTRY_AUTH_ISSUERS: {{ .issuers | toJson | quote }}
  AGENT_REGISTRY_AUTH_CLOCK_SKEW: {{ .clockSkew | quote }}
  AGENT_REGISTRY_AUTH_JWKS_REFRESH: {{ .jwksRefresh | quote }}
  AGENT_REGISTRY_AUTH_OPEN_PATHS: {{ join "," .openPaths | quote }}
  AGENT_REGISTRY_AUTHZEN_URL: {{ .authzen.url | quote }}
  AGENT_REGISTRY_AUTHZEN_TIMEOUT: {{ .authzen.timeout | quote }}
  AGENT_REGISTRY_AUTHZEN_CACHE_TTL: {{ .authzen.cacheTTL | quote }}
  AGENT_REGISTRY_AUTHZEN_LIST_MAX: {{ .authzen.listMax | quote }}
  {{- if .authzen.tokenUrl }}
  AGENT_REGISTRY_AUTHZEN_TOKEN_URL: {{ .authzen.tokenUrl | quote }}
  AGENT_REGISTRY_AUTHZEN_CLIENT_ID: {{ .authzen.clientId | quote }}
  {{- with .authzen.scopes }}
  AGENT_REGISTRY_AUTHZEN_SCOPES: {{ join "," . | quote }}
  {{- end }}
  {{- end }}
  {{- if .ui.clientId }}
  AGENT_REGISTRY_AUTH_UI_ISSUER: {{ .ui.issuer | quote }}
  AGENT_REGISTRY_AUTH_UI_CLIENT_ID: {{ .ui.clientId | quote }}
  AGENT_REGISTRY_AUTH_UI_SCOPES: {{ .ui.scopes | quote }}
  {{- end }}
  {{- if .mcp.resource }}
  AGENT_REGISTRY_AUTH_MCP_RESOURCE: {{ .mcp.resource | quote }}
  {{- with .mcp.scopes }}
  AGENT_REGISTRY_AUTH_MCP_SCOPES: {{ join "," . | quote }}
  {{- end }}
  {{- end }}
  {{- end }}
  {{- end }}
