suite: ConfigMap
templates:
  - configmap.yaml

tests:
  - it: renders a ConfigMap by default
    asserts:
      - isKind:
          of: ConfigMap
      - hasDocuments:
          count: 1

  - it: has correct name
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-agentregistry-config

  - it: is created in the release namespace
    asserts:
      - equal:
          path: metadata.namespace
          value: NAMESPACE

  - it: has standard labels
    asserts:
      - isSubset:
          path: metadata.labels
          content:
            app.kubernetes.io/name: agentregistry
            app.kubernetes.io/instance: RELEASE-NAME
            app.kubernetes.io/managed-by: Helm

  - it: sets AGENT_REGISTRY_SERVER_ADDRESS
    asserts:
      - equal:
          path: data.AGENT_REGISTRY_SERVER_ADDRESS
          value: ":8080"

  - it: sets AGENT_REGISTRY_MCP_PORT
    asserts:
      - equal:
          path: data.AGENT_REGISTRY_MCP_PORT
          value: "31313"

  - it: sets AGENT_REGISTRY_ENABLE_REGISTRY_VALIDATION
    asserts:
      - equal:
          path: data.AGENT_REGISTRY_ENABLE_REGISTRY_VALIDATION
          value: "false"

  - it: overrides serverAddress
    set:
      config.serverAddress: ":9090"
    asserts:
      - equal:
          path: data.AGENT_REGISTRY_SERVER_ADDRESS
          value: ":9090"

  - it: applies fullnameOverride
    set:
      fullnameOverride: myapp
    asserts:
      - equal:
          path: metadata.name
          value: myapp-config

  - it: renders the HTTP hardening defaults
    asserts:
      - equal:
          path: data.AGENT_REGISTRY_HTTP_READ_TIMEOUT
          value: 30s
      - equal:
          path: data.AGENT_REGISTRY_HTTP_WRITE_TIMEOUT
          value: 2m
      - equal:
          path: data.AGENT_REGISTRY_HTTP_IDLE_TIMEOUT
          value: 2m
      - equal:
          path: data.AGENT_REGISTRY_HTTP_MAX_BODY_BYTES
          value: "1048576"
      - equal:
          path: data.AGENT_REGISTRY_HTTP_HSTS_MAX_AGE
          value: 0s
      - notExists:
          path: data.AGENT_REGISTRY_CORS_ALLOWED_ORIGINS
      - notExists:
          path: data.AGENT_REGISTRY_HTTP_CSP

  - it: renders CORS origins, HSTS and a custom CSP
    set:
      http:
        corsAllowedOrigins: [https://portal.example.com, http://localhost:3000]
        hstsMaxAge: 8760h
        maxBodyBytes: 4194304
        contentSecurityPolicy: default-src 'self'
    asserts:
      - equal:
          path: data.AGENT_REGISTRY_CORS_ALLOWED_ORIGINS
          value: https://portal.example.com,http://localhost:3000
      - equal:
          path: data.AGENT_REGISTRY_HTTP_HSTS_MAX_AGE
          value: 8760h
      - equal:
          path: data.AGENT_REGISTRY_HTTP_MAX_BODY_BYTES
          value: "4194304"
      - equal:
          path: data.AGENT_REGISTRY_HTTP_CSP
          value: default-src 'self'

  - it: renders the audit log defaults
    asserts:
      - equal:
          path: data.AGENT_REGISTRY_AUDIT_ENABLED
          value: "true"
      - equal:
          path: data.AGENT_REGISTRY_AUDIT_RETENTION
          value: 2160h
      - equal:
          path: data.AGENT_REGISTRY_AUDIT_OTLP
          value: "false"
      - notExists:
          path: data.OTEL_EXPORTER_OTLP_ENDPOINT

  - it: renders OTLP export of audit events
    set:
      audit:
        retention: 720h
        otlp:
          enabled: true
          endpoint: http://otel-collector:4318
    asserts:
      - equal:
          path: data.AGENT_REGISTRY_AUDIT_RETENTION
          value: 720h
      - equal:
          path: data.AGENT_REGISTRY_AUDIT_OTLP
          value: "true"
      - equal:
          path: data.OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://otel-collector:4318

  - it: turns the audit log off
    set:
      audit:
        enabled: false
    asserts:
      - equal:
          path: data.AGENT_REGISTRY_AUDIT_ENABLED
          value: "false"
